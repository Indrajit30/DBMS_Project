[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiwarehouse-data-generation"
version = "0.1.0"
description = "Reproducible synthetic data generator for the multiwarehouse course project"
requires-python = ">=3.10"
dependencies = [
  "bcrypt==5.0.0",
  "psycopg[binary]==3.3.6",
]

[tool.setuptools]
py-modules = ["generate"]
